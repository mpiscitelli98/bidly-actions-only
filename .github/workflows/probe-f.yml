name: probe-f


on:
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpiscitelli98/bidly
          token: ${{ secrets.GH_TOKEN }}
      - name: Run watcher (fresco giornaliero: TED + PVL 7gg + MePA + avvisi, senza ANAC bulk)
        run: node scripts/tender-watcher.js --pvl-window=7 --skip=anac
      - name: Commit dati aggiornati su bidly
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@local"
          git pull --rebase || true
          git add gare-privata/tenders.json gare-privata/.tender-seen.json
          git diff --cached --quiet || git commit -m "chore: aggiornamento giornaliero bandi [skip ci]"
          git push || (git pull --rebase && git push)

