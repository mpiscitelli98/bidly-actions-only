name: probe-b

on:
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Run watcher
        run: node scripts/tender-watcher.js --pvl-window=7 --skip=anac
      - name: Commit
        run: |
          git config user.name "tender-bot"
          git diff --cached --quiet || git commit -m "test [skip ci]"
          git push || true
