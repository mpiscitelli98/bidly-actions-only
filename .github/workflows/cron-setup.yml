name: cron-setup

# Setup manuale (una tantum + ogni modifica schedule) dei 2 job su cron-job.org.
# Secret necessari in QUESTO repo: CRON_JOB_API (cron-job.org) e GH_TOKEN (PAT con contents R/W su bidly, per il dispatch).
# Esegui da Actions -> cron-setup -> Run workflow.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Crea/aggiorna job cron-job.org
        env:
          CRON_JOB_API: ${{ secrets.CRON_JOB_API }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node -e "
          (async () => {
            const API = 'https://api.cron-job.org';
            const H = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + process.env.CRON_JOB_API };
            const api = async (m, p, b) => {
              const r = await fetch(API + p, { method: m, headers: H, body: b ? JSON.stringify(b) : undefined });
              if (!r.ok) throw new Error(m + ' ' + p + ' -> ' + r.status + ' ' + (await r.text()).slice(0, 200));
              return r.json();
            };
            const dispatchHeaders = {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + process.env.GH_TOKEN,
              'Content-Type': 'application/json',
            };
            const jobs = [
              {
                title: 'bidly tender-daily',
                schedule: { timezone: 'Europe/Rome', hours: [7], minutes: [0], mdays: [-1], months: [-1], wdays: [-1] },
                event: 'tender-daily',
              },
              {
                title: 'bidly tender-weekly',
                schedule: { timezone: 'Europe/Rome', hours: [7], minutes: [30], mdays: [-1], months: [-1], wdays: [1] },
                event: 'tender-weekly',
              },
            ];
            const existing = await api('GET', '/jobs');
            for (const j of jobs) {
              for (const e of (existing.jobs || []).filter((x) => x.title === j.title)) {
                await api('DELETE', '/jobs/' + e.jobId);
                console.log('eliminato job esistente:', e.jobId);
              }
              const body = JSON.stringify({ event_type: j.event });
              const created = await api('PUT', '/jobs', {
                job: {
                  url: 'https://api.github.com/repos/mpiscitelli98/bidly-actions-only/dispatches',
                  enabled: true,
                  title: j.title,
                  saveResponses: true,
                  requestMethod: 1,
                  requestTimeout: 60,
                  schedule: { ...j.schedule, expiresAt: 0 },
                  extendedData: { headers: dispatchHeaders, body },
                  notification: { onFailure: true, onSuccess: false },
                },
              });
              console.log('creato job:', j.title, '->', created.jobId);
            }
          })().catch((e) => { console.error('CRON-SETUP FAIL:', e.message); process.exit(1); });
          "
